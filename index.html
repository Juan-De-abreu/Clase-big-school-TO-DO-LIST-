<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="hero-main">
        <h1>Diario de Estudio</h1>
        <p class="hero-tagline">Tu constancia, visible</p>
      </div>
      <div class="hero-stats">
        <div class="stat-streak">
          <span class="streak-value" id="streakValue">0</span>
          <span class="streak-underline"></span>
          <span class="streak-label">días seguidos</span>
        </div>
        <div class="stat-best">
          <span class="stat-label">Mejor racha</span>
          <span class="stat-value" id="bestStreakValue">0</span>
          <span class="stat-unit">días</span>
        </div>
      </div>
    </header>

    <section class="stats-grid">
      <article class="stat-card weekly">
        <header class="stat-header">
          <h2>Esta semana</h2>
        </header>
        <div class="stat-content">
          <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="600">
            <div class="progress-fill" id="weeklyProgress" style="width: 0%"></div>
          </div>
          <div class="stat-meta">
            <span class="stat-value weekly-minutes" id="weeklyMinutes">0 min</span>
            <span class="stat-value weekly-hours" id="weeklyHours" hidden>0h 0min</span>
          </div>
        </div>
      </article>

      <article class="stat-card monthly">
        <header class="stat-header">
          <h2>Este mes</h2>
        </header>
        <div class="stat-content">
          <span class="monthly-value" id="monthlyValue">0</span>
          <span class="stat-label">días de estudio</span>
        </div>
      </article>
    </section>

    <section class="heatmap-section" aria-labelledby="heatmapTitle">
      <header class="heatmap-header">
        <h2 id="heatmapTitle">Constancia</h2>
        <div class="heatmap-ranges" role="group" aria-label="Rango del mapa de calor">
          <button type="button" class="heatmap-range-btn" data-preset="4w" aria-pressed="false">4 sem</button>
          <button type="button" class="heatmap-range-btn" data-preset="12w" aria-pressed="false">12 sem</button>
          <button type="button" class="heatmap-range-btn" data-preset="26w" aria-pressed="false">26 sem</button>
          <button type="button" class="heatmap-range-btn" data-preset="52w" aria-pressed="false">52 sem</button>
          <button type="button" class="heatmap-range-btn" data-preset="year" aria-pressed="false">Año</button>
        </div>
      </header>
      <div class="heatmap-body">
        <div class="heatmap-weekdays" aria-hidden="true">
          <span>lun</span>
          <span></span>
          <span>mié</span>
          <span></span>
          <span>vie</span>
          <span></span>
          <span></span>
        </div>
        <div class="heatmap-scroll" id="heatmapScroll">
          <table class="heatmap-grid" id="heatmapGrid" role="grid" aria-label="Mapa de calor de constancia"></table>
        </div>
      </div>
      <div class="heatmap-legend" role="note" aria-label="Intensidad de estudio: de 0 minutos a 8 horas o más">
        <span class="heatmap-legend-label">0 min</span>
        <span class="heatmap-swatch heat-level-0" aria-hidden="true"></span>
        <span class="heatmap-swatch heat-level-1" aria-hidden="true"></span>
        <span class="heatmap-swatch heat-level-2" aria-hidden="true"></span>
        <span class="heatmap-swatch heat-level-3" aria-hidden="true"></span>
        <span class="heatmap-swatch heat-level-4" aria-hidden="true"></span>
        <span class="heatmap-swatch heat-level-5" aria-hidden="true"></span>
        <span class="heatmap-legend-label">8 h+</span>
      </div>
    </section>

    <section class="form-section">
      <header class="section-header">
        <h2>Nueva sesión</h2>
      </header>
      <form id="sessionForm" class="session-form">
        <div class="form-row">
          <div class="form-group">
            <label for="dateInput">Fecha</label>
            <input type="date" id="dateInput" required>
          </div>
          <div class="form-group">
            <label for="minutesInput">Minutos</label>
            <input type="number" id="minutesInput" min="1" placeholder="Ej: 45" required>
          </div>
        </div>
        <div class="form-group">
          <label for="topicInput">Tema</label>
          <input type="text" id="topicInput" placeholder="Ej: JavaScript, React, Bases de datos..." required maxlength="100">
        </div>
        <button type="submit" class="btn-primary">Guardar sesión</button>
      </form>
    </section>

    <section class="sessions-section">
      <header class="section-header">
        <div class="sessions-heading">
          <h2 id="sessionsTitle" tabindex="-1">Sesiones</h2>
          <span class="session-count" id="sessionCount">0</span>
          <button type="button" class="btn-clear-filter" id="clearFilterBtn" hidden>Limpiar filtro</button>
        </div>
      </header>
      <ul id="sessionsList" class="sessions-list"></ul>
      <p id="emptyMessage" class="empty-message" hidden>No hay sesiones aún. Empieza a estudiar.</p>
    </section>
  </main>

  <div id="heatmapTooltip" class="heatmap-tooltip" role="tooltip" hidden></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
