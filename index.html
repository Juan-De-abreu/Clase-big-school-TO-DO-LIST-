<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="hero-main">
        <h1>Diario de Estudio</h1>
        <p class="hero-tagline">Tu constancia, visible</p>
      </div>
      <div class="hero-stats">
        <div class="stat-streak">
          <span class="streak-value" id="streakValue">0</span>
          <span class="streak-underline"></span>
          <span class="streak-label">días seguidos</span>
        </div>
        <div class="stat-best">
          <span class="stat-label">Mejor racha</span>
          <span class="stat-value" id="bestStreakValue">0</span>
          <span class="stat-unit">días</span>
        </div>
      </div>
    </header>

    <section class="stats-grid">
      <article class="stat-card weekly">
        <header class="stat-header">
          <h2>Esta semana</h2>
        </header>
        <div class="stat-content">
          <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="600">
            <div class="progress-fill" id="weeklyProgress" style="width: 0%"></div>
          </div>
          <div class="stat-meta">
            <span class="stat-value weekly-minutes" id="weeklyMinutes">0 min</span>
            <span class="stat-value weekly-hours" id="weeklyHours" hidden>0h 0min</span>
          </div>
        </div>
      </article>

      <article class="stat-card monthly">
        <header class="stat-header">
          <h2>Este mes</h2>
        </header>
        <div class="stat-content">
          <span class="monthly-value" id="monthlyValue">0</span>
          <span class="stat-label">días de estudio</span>
        </div>
      </article>
    </section>

    <section class="form-section">
      <header class="section-header">
        <h2>Nueva sesión</h2>
      </header>
      <form id="sessionForm" class="session-form">
        <div class="form-row">
          <div class="form-group">
            <label for="dateInput">Fecha</label>
            <input type="date" id="dateInput" required>
          </div>
          <div class="form-group">
            <label for="minutesInput">Minutos</label>
            <input type="number" id="minutesInput" min="1" placeholder="Ej: 45" required>
          </div>
        </div>
        <div class="form-group">
          <label for="topicInput">Tema</label>
          <input type="text" id="topicInput" placeholder="Ej: JavaScript, React, Bases de datos..." required maxlength="100">
        </div>
        <button type="submit" class="btn-primary">Guardar sesión</button>
      </form>
    </section>

    <section class="sessions-section">
      <header class="section-header">
        <h2>Sesiones</h2>
        <span class="session-count" id="sessionCount">0</span>
      </header>
      <ul id="sessionsList" class="sessions-list"></ul>
      <p id="emptyMessage" class="empty-message" hidden>No hay sesiones aún. Empieza a estudiar.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
